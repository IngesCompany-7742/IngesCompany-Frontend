<div class="auth-container">
  <mat-card class="auth-card">
    <mat-card-header>
      <mat-card-title>Register for DoofPlus</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="form" (submit)="performSignUp()" class="auth-form">
        <mat-form-field appearance="outline">
          <mat-label>Username</mat-label>
          <input matInput id="username" name="username" required formControlName="username">
          @if (form.controls['username'].invalid && form.controls['username'].touched) {
            <mat-error>Username is required</mat-error>
          }
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Password</mat-label>
          <input matInput type="password" id="password" name="password" required formControlName="password">
          @if (form.controls['password'].invalid && form.controls['password'].touched) {
            <mat-error>Password is required</mat-error>
          }
        </mat-form-field>

        <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid" class="submit-btn">
          Sign Up
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
